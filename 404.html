<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — Conoce a Dios</title>
<meta name="theme-color" content="#2352AE">
<link rel="icon" href="/conoceaDios/assets/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/conoceaDios/assets/apple-touch-icon.png">
<style>
  :root { --blue:#2352AE; --deep:#1A3F87; --lime:#D0FF51; --soft:#D5E3FF; }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center; padding:32px;
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Roboto, Arial, sans-serif;
    background:linear-gradient(170deg, var(--deep), var(--blue)); color:#fff; text-align:center;
  }
  main { max-width:520px; }
  img { width:112px; height:112px; margin:0 0 24px; }
  .code {
    display:inline-block; font-size:.8rem; letter-spacing:.22em; font-weight:700;
    color:var(--lime); text-transform:uppercase; margin-bottom:12px;
  }
  h1 { font-size:clamp(1.7rem, 5vw, 2.4rem); line-height:1.15; margin:0 0 14px; }
  p { color:var(--soft); margin:0 0 30px; line-height:1.6; }
  a.btn {
    display:inline-block; padding:15px 30px; border-radius:999px; text-decoration:none;
    background:var(--lime); color:#14306A; font-weight:700; letter-spacing:.01em;
    transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 8px 24px rgba(0,0,0,.18);
  }
  a.btn:hover, a.btn:focus-visible { transform:translateY(-2px); box-shadow:0 12px 28px rgba(0,0,0,.24); }
  a.btn:focus-visible { outline:3px solid #fff; outline-offset:3px; }
</style>
</head>
<body>
<main>
  <img src="/conoceaDios/assets/logo.png" alt="Catedral de Fe" width="112" height="112">
  <span class="code">Error 404</span>
  <h1>No encontramos esta página</h1>
  <p>Puede que el enlace esté incompleto o que la página se haya movido. Pero la buena noticia sigue igual: siempre puedes volver al inicio.</p>
  <a class="btn" href="/conoceaDios/">Volver al inicio</a>
</main>
</body>
</html>
